# Tool settings only (ruff, pytest); the project is not installed as a package.

[tool.ruff]
line-length = 120
src = ["src", "scripts"]
# Dataset builder from the course, kept identical to the version we were given.
extend-exclude = ["scripts/make_wikiart_subset.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
